name: CI Test Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: phar.readonly=0
          extensions: json, phar, zlib, bz2, mbstring

      - name: Run PHP Syntax Check
        run: |
          find src/ -name "*.php" -exec php -l {} \;
          php -l bin/single-php

      - name: Run Single-PHP Test Suites
        run: |
          php tests/run_tests.php

      - name: Test CLI Doctor & Check
        run: |
          chmod +x bin/single-php
          ./bin/single-php doctor
          ./bin/single-php check examples/01_simple_cli
          ./bin/single-php check examples/02_composer_console
          ./bin/single-php check examples/03_sqlite_tool
          ./bin/single-php check examples/04_web_api
